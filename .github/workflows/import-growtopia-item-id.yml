name: import growtopia item id

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-item-id:
    runs-on: ubuntu-latest

    steps:
      - name: ambil repo
        uses: actions/checkout@v4

      - name: download data sumber
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p data

          curl \
            --fail \
            --location \
            --retry 3 \
            --silent \
            --show-error \
            "https://raw.githubusercontent.com/zephilion/growtopia-item-id/960738a1ce32f7f951baaa697d82a095980efe2c/click-here" \
            --output data/growtopia-item-id.txt

          total=$(wc -l < data/growtopia-item-id.txt)

          if [ "$total" -lt 6000 ]; then
            echo "datanya kepotong, cuma dapet $total baris"
            exit 1
          fi

          grep -q '^242: World Lock' data/growtopia-item-id.txt
          grep -q '^6830: Anomalizing Exquisite Trowel' data/growtopia-item-id.txt

          echo "data aman, total $total baris"

      - name: simpen ke repo
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/growtopia-item-id.txt

          if git diff --cached --quiet; then
            echo "datanya udah sama, ga ada yang perlu dicommit"
            exit 0
          fi

          git commit -m "data: update snapshot item id Growtopia"
          git push
